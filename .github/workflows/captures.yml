# Walk the running viewer through a few shaders and publish the frames and
# a video of the walk as a run artifact — visual smoke over the bank's four
# categories without a browser, from one simulator run.
#
# The viewer starts on the shader named by SHADERBANK_SHADER (see the env
# hook in main.lua where the manual-load examples are); the steps file in
# .github/walk/bank.steps does the rest: keys step within a category, taps
# on the segmented control switch category, and every step waits for the
# viewer's own "name: <shader>" line before the next snapshot.
name: Captures

on:
  push:
    branches: [main]
    paths:
      - "main.lua"
      - "config.lua"
      - "_shader/**"
      - ".github/walk/**"
      - ".github/workflows/captures.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Solar2D container tag to capture with (e.g. 3734, latest)"
        required: false

permissions:
  contents: read

env:
  # Same pinning policy as pages.yml, but a frame-tap release: the input
  # FIFO, frame tap and offscreen sizing the walk needs exist from 3734 on.
  SOLAR2D_TAG: "3734"

jobs:
  walk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve container image
        run: |
          TAG="${{ inputs.image_tag || env.SOLAR2D_TAG }}"
          echo "IMAGE=ghcr.io/chkuendig/solar2d:${TAG}" >> "$GITHUB_ENV"
          echo "Walking with ghcr.io/chkuendig/solar2d:${TAG}"

      - name: Walk the bank
        uses: chkuendig/docker-solar2d/.github/actions/walk@dd8b81ab111a25c4a634c514ae466ef21c11256a
        with:
          project: .
          steps: .github/walk/bank.steps
          output: captures
          screen: 320x480
          video: "true"
          image: ${{ env.IMAGE }}
          env: |
            SHADERBANK_SHADER=Generator:kernelG_BG_balatro

      - name: Upload captures
        uses: actions/upload-artifact@v4
        with:
          name: shader-captures
          path: captures/
          retention-days: 14
          if-no-files-found: error
